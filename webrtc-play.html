<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>h265web.js WebRTC WHEP Playback Demo</title>
    <script src="./static/h265web.js"></script>
    <style>
        body { max-width: 920px; margin: 32px auto; padding: 0 20px; font: 16px/1.5 system-ui, sans-serif; color: #18212f; }
        #player { width: 640px; max-width: 100%; min-height: 360px; background: #111; }
        input { width: min(680px, 100%); padding: 10px; }
        button, select { margin: 12px 8px 12px 0; padding: 10px 14px; }
        #status { white-space: pre-wrap; font-family: ui-monospace, monospace; }
    </style>
</head>
<body>
    <h1>h265web.js WebRTC WHEP Playback Demo</h1>
    <p><input id="media-url" value="http://127.0.0.1/index/api/whep?app=live&amp;stream=test" aria-label="WebRTC playback URL" /></p>
    <button class="preset" data-url="http://127.0.0.1/index/api/whep?app=live&amp;stream=test" type="button">WHEP</button>
    <button class="preset" data-url="webrtc://127.0.0.1/live/test" type="button">webrtc://</button>
    <button class="preset" data-url="http://127.0.0.1/index/api/webrtc?app=live&amp;stream=test&amp;type=play" type="button">ZLM API</button>
    <p>
        <select id="core" aria-label="Core">
            <option value="">Auto</option>
            <option value="webrtc">WebRTC</option>
        </select>
        <button id="create-load" type="button">Create + Load</button>
        <button id="play" type="button">Play</button>
        <button id="pause" type="button">Pause</button>
        <button id="release" type="button">Release</button>
    </p>
    <div id="player"></div>
    <div id="status">Idle</div>
    <p><a href="./webrtc-publish.html">Open the WHIP publish demo</a></p>

    <script>
        let player = null;
        let pendingLoad = false;
        const status = document.getElementById('status');
        const urlInput = document.getElementById('media-url');

        function setStatus(message) {
            status.textContent = message;
        }

        function buildAndLoad() {
            const url = urlInput.value.trim();
            if (!url) {
                setStatus('WebRTC URL is required');
                return;
            }
            player = H265webjsPlayer();
            player.on_ready_show_done_callback = function () {
                setStatus(`First frame ready\n${url}`);
            };
            player.on_play_time = function (seconds) {
                setStatus(`Playing ${Number(seconds).toFixed(3)} s\n${url}`);
            };
            player.on_error_callback = function (error) {
                setStatus(`Playback error\n${JSON.stringify(error)}`);
            };
            player.on_release_done_callback = function () {
                player = null;
                setStatus('Released');
                if (pendingLoad) {
                    pendingLoad = false;
                    buildAndLoad();
                }
            };
            const config = {
                player_id: 'player',
                base_url: './static/',
                wasm_js_uri: 'h265web_wasm.js',
                wasm_wasm_uri: 'h265web_wasm.wasm',
                width: 640,
                height: 360,
                auto_play: false,
                ignore_audio: false
            };
            const core = document.getElementById('core').value;
            if (core) {
                config.core = core;
            }
            if (!player.build(config)) {
                player = null;
                setStatus('Player build failed');
                return;
            }
            player.set_voice(0);
            player.load_media(url);
            setStatus(`Loading\n${url}`);
        }

        function createAndLoad() {
            if (player) {
                pendingLoad = true;
                player.release();
                return;
            }
            buildAndLoad();
        }

        document.querySelectorAll('.preset').forEach((button) => {
            button.addEventListener('click', () => {
                urlInput.value = button.dataset.url;
            });
        });
        document.getElementById('create-load').addEventListener('click', createAndLoad);
        document.getElementById('play').addEventListener('click', () => player && player.play());
        document.getElementById('pause').addEventListener('click', () => player && player.pause());
        document.getElementById('release').addEventListener('click', () => player && player.release());
    </script>
</body>
</html>
